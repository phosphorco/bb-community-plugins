name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Existing tagged package to publish or retry
        required: true
        type: choice
        options:
          - message-timings-nerd
          - people-accounts
          - cross-references
          - machine-monitor
          - agentation-mentions
          - perspectives
          - sticky-notes
          - bb-ui-reference
          - plugin-guide-for-nerds
          - attach-text-snippets
          - bb-identity
          - bb-provider-settings
          - bb-context-recognition
          - bb-cross-references
          - bb-agent-connection
          - bb-people-accounts
          - bb-usage-algebra
          - bb-thread-metrics
          - bb-thread-membership
          - bb-thread-context
      dry_run:
        type: boolean
        default: false
        description: Verify the release and upload a receipt without publishing
      dist_tag:
        description: Reviewed tag; identity next only, membership first publish latest
        type: choice
        default: latest
        options: [latest, next]
      expected_sha:
        description: Exact checked-out commit for a pinned reviewed release
        type: string
      expected_version:
        description: Exact approved version (identity 0.4.0/0.4.1/0.4.2-native-marker.0/0.5.0, membership 0.1.0)
        type: string
      proof_run_id:
        description: Reviewed successful dry-run ID; required for pinned-next publish
        type: string
      expected_payload_sha256:
        description: Reviewed dry-run tgz SHA256; required for pinned-next publish
        type: string
      expected_preflight_tags:
        description: Exact owner-approved preflight dist-tags JSON for final publish
        type: string
      expected_receipt_sha256:
        description: Reviewed dry-run receipt SHA256; required for pinned-next publish
        type: string
  push:
    tags:
      - "message-timings-nerd/v*"
      - "people-accounts/v*"
      - "cross-references/v*"
      - "machine-monitor/v*"
      - "agentation-mentions/v*"
      - "perspectives/v*"
      - "sticky-notes/v*"
      - "bb-ui-reference/v*"
      - "plugin-guide-for-nerds/v*"
      - "attach-text-snippets/v*"
      - "bb-identity/v*"
      - "bb-provider-settings/v*"
      - "bb-context-recognition/v*"
      - "bb-cross-references/v*"
      - "bb-agent-connection/v*"
      - "bb-people-accounts/v*"
      - "bb-usage-algebra/v*"
      - "bb-thread-metrics/v*"
      - "bb-thread-membership/v*"
      - "bb-thread-context/v*"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'phosphorco/bb-community-plugins'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      EXPECTED_PAYLOAD_SHA256: ${{ inputs.expected_payload_sha256 }}
      EXPECTED_RECEIPT_SHA256: ${{ inputs.expected_receipt_sha256 }}
      EXPECTED_PREFLIGHT_TAGS: ${{ inputs.expected_preflight_tags }}
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Acquire the exact fork SDK release artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' && !inputs.dry_run && ((inputs.plugin == 'bb-identity' && inputs.dist_tag == 'next') || inputs.plugin == 'bb-thread-membership')) }}
        # SDK archives are retained outside Git. Verify immutable selected bytes.
        shell: bash
        run: |
          mkdir -p ../sdk-artifacts
          archive='get-bb-plugin-sdk-0.6.52+phosphor.975e38f02f1a.sdk.12eb78c20820.tgz'
          base='https://github.com/phosphorco/bb-fork/releases/download/sdk-0.6.52-phosphor.975e38f02f1a'
          curl --fail --location --retry 3 "$base/$archive" --output "../sdk-artifacts/$archive"
          curl --fail --location --retry 3 "$base/$archive.provenance.json" --output "../sdk-artifacts/$archive.provenance.json"
          printf '%s  %s\n' 'f9bca05575191c8e9be5bf8d641755dbea95cd00853869e9e472b428c366d5ae' "../sdk-artifacts/$archive" | sha256sum --check
          printf '%s  %s\n' '4b531f886692b34d66fb97bda8178f8d666a9bd3692d853379f45992d8591bb7' "../sdk-artifacts/$archive.provenance.json" | sha256sum --check

      - name: Set up Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Select and verify the release source
        id: release
        shell: bash
        env:
          REQUESTED_PLUGIN: ${{ inputs.plugin }}
          REQUESTED_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          dist_tag="${REQUESTED_DIST_TAG:-latest}"
          case "$dist_tag" in latest|next) ;; *) echo "Unsupported npm dist-tag" >&2; exit 1 ;; esac
          plugin="${REQUESTED_PLUGIN:-${GITHUB_REF_NAME%%/*}}"
          case "$plugin" in
            message-timings-nerd) workspace="@phosphorco/bb-plugin-message-timings-nerd" ;;
            people-accounts) workspace="@phosphorco/bb-plugin-people-accounts" ;;
            cross-references) workspace="@phosphorco/bb-plugin-cross-references" ;;
            machine-monitor) workspace="@phosphorco/bb-plugin-machine-monitor" ;;
            agentation-mentions) workspace="@phosphorco/bb-plugin-agentation-mentions" ;;
            perspectives) workspace="@phosphorco/bb-plugin-perspectives" ;;
            sticky-notes) workspace="@phosphorco/bb-plugin-sticky-notes" ;;
            bb-ui-reference) workspace="@phosphorco/bb-plugin-bb-ui-reference" ;;
            plugin-guide-for-nerds) workspace="@phosphorco/bb-plugin-plugin-guide-for-nerds" ;;
            attach-text-snippets) workspace="@phosphorco/bb-plugin-attach-text-snippets" ;;
            bb-identity) workspace="@phosphorco/bb-identity" ;;
            bb-provider-settings) workspace="@phosphorco/bb-provider-settings" ;;
            bb-context-recognition) workspace="@phosphorco/bb-context-recognition" ;;
            bb-cross-references) workspace="@phosphorco/bb-cross-references" ;;
            bb-agent-connection) workspace="@phosphorco/bb-agent-connection" ;;
            bb-people-accounts) workspace="@phosphorco/bb-people-accounts" ;;
            bb-usage-algebra) workspace="@phosphorco/bb-usage-algebra" ;;
            bb-thread-metrics) workspace="@phosphorco/bb-thread-metrics" ;;
            bb-thread-context) workspace="@phosphorco/bb-thread-context" ;;
            bb-thread-membership) workspace="@phosphorco/bb-thread-membership" ;;
            *) echo "Unsupported release plugin: $plugin" >&2; exit 1 ;;
          esac
          case "$plugin" in
            bb-identity|bb-provider-settings|bb-context-recognition|bb-cross-references|bb-agent-connection|bb-people-accounts|bb-usage-algebra|bb-thread-metrics|bb-thread-membership|bb-thread-context) path="packages/$plugin" ;;
            *) path="plugins/$plugin" ;;
          esac
          package_version="$(npm pkg get version --workspace "$workspace" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(Object.values(JSON.parse(input))[0]))')"
          # Attribution contract candidates publish under next until their stable release.
          if [ "$plugin" = "bb-people-accounts" ] && [[ "$package_version" == *-* ]]; then
            dist_tag=next
          fi
          if [ "$plugin" = bb-thread-membership ]; then
            test "$package_version" = 0.1.0 || { echo "Unapproved membership release version" >&2; exit 1; }
          fi
          pinned_next=false
          pinned_row=false
          case "$plugin@$package_version" in
            bb-identity@0.4.0|bb-identity@0.4.1|bb-identity@0.4.2-native-marker.0|bb-identity@0.5.0|bb-thread-membership@0.1.0) pinned_row=true ;;
          esac
          case "$plugin@$package_version" in
            bb-identity@0.5.0) test "$dist_tag" = next || { echo "Identity 0.5.0 requires next" >&2; exit 1; } ;;
            bb-thread-membership@0.1.0) test "$dist_tag" = latest || { echo "First membership release requires latest" >&2; exit 1; } ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { { [ "$plugin" = "bb-identity" ] && [ "$dist_tag" = "next" ]; } || [ "$plugin@$package_version" = "bb-thread-membership@0.1.0" ]; }; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected an exact lower-case source SHA" >&2; exit 1; }
            test "$pinned_row" = true && test "$package_version" = "$EXPECTED_VERSION" || { echo "Pinned package version drift" >&2; exit 1; }
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" && test "$GITHUB_SHA" = "$EXPECTED_SHA" || { echo "Pinned checkout SHA drift" >&2; exit 1; }
            if [ "$DRY_RUN" != "true" ]; then
              [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] && [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] && [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Reviewed dry-run ID and payload/receipt hashes required" >&2; exit 1; }
            fi
            pinned_next=true
            echo "Pinned manual release: tag prerequisite bypassed for $plugin $EXPECTED_SHA@$EXPECTED_VERSION"
          else
            if [ "$pinned_row" = true ] && [ "$DRY_RUN" != "true" ]; then
              echo "$plugin@$package_version requires its reviewed pinned manual release; automatic/default publication refused" >&2
              exit 1
            fi
            release_tag="$plugin/v$package_version"
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || test "$GITHUB_REF_NAME" = "$release_tag" || {
              echo "Tag $GITHUB_REF_NAME does not match $workspace@$package_version" >&2
              exit 1
            }
            if tag_commit="$(git rev-parse -q --verify "refs/tags/$release_tag^{commit}")"; then
              git diff --quiet "$tag_commit" HEAD -- "$path" || {
                echo "The tagged $plugin source differs from the requested workflow revision" >&2
                exit 1
              }
            elif [ "$DRY_RUN" = "true" ]; then
              # A dry run may prove a release before its tag exists; it verifies the dispatched revision and never publishes.
              echo "dry run before tag $release_tag: verifying $path at $GITHUB_SHA"
            else
              echo "Release tag $release_tag does not exist" >&2
              exit 1
            fi
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "pinned_next=$pinned_next" >> "$GITHUB_OUTPUT"
          # Preserve every existing identity hotfix artifact name.
          case "$plugin@$package_version" in
            bb-identity@0.4.0|bb-identity@0.4.1|bb-identity@0.4.2-native-marker.0)
              echo "pinned_artifact=bb-identity-next-$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
              echo "pinned_publication=bb-identity-next-publication" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "pinned_artifact=reviewed-$plugin-$package_version-$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
              echo "pinned_publication=reviewed-$plugin-$package_version-publication" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$plugin@$package_version" = "bb-thread-membership@0.1.0" ]; then
            echo "pinned_route=membership-bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "pinned_route=oidc" >> "$GITHUB_OUTPUT"
          fi
          echo "pinned_tgz=$(printf '%s' "$workspace" | sed 's#^@##; s#/#-#')-$package_version.tgz" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        if: ${{ steps.release.outputs.pinned_next != 'true' || inputs.dry_run }}
        run: npm ci

      - name: Build shared packages for tests
        if: ${{ steps.release.outputs.pinned_next != 'true' || inputs.dry_run }}
        # Packages test against their own dist, and plugins import the workspace-linked packages' dist.
        run: npm run build --workspace packages/bb-identity --workspace packages/bb-provider-settings --workspace packages/bb-context-recognition --workspace packages/bb-cross-references --workspace packages/bb-agent-connection --workspace packages/bb-people-accounts --workspace packages/bb-usage-algebra --workspace packages/bb-thread-metrics --workspace packages/bb-thread-membership --workspace packages/bb-thread-context

      - name: Test
        if: ${{ steps.release.outputs.pinned_next != 'true' || inputs.dry_run }}
        run: npm run test --workspace "${{ steps.release.outputs.workspace }}"

      - name: Typecheck
        if: ${{ steps.release.outputs.pinned_next != 'true' || inputs.dry_run }}
        run: npm run typecheck --workspace "${{ steps.release.outputs.workspace }}"

      - name: Build BB artifacts
        if: ${{ steps.release.outputs.pinned_next != 'true' }}
        run: npm run build --workspace "${{ steps.release.outputs.workspace }}"

      - name: Inspect package contents
        if: ${{ steps.release.outputs.pinned_next != 'true' }}
        run: npm pack --dry-run --ignore-scripts --workspace "${{ steps.release.outputs.workspace }}"

      - name: Pack the pinned-next dry-run payload once
        if: ${{ steps.release.outputs.pinned_next == 'true' && inputs.dry_run }}
        shell: bash
        env:
          RELEASE_PLUGIN: ${{ steps.release.outputs.plugin }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
        run: |
          mkdir release-candidate
          npm pack --ignore-scripts --json --workspace "$RELEASE_WORKSPACE" --pack-destination release-candidate > release-candidate/pack.json
          python3 .github/scripts/bb-identity-next-release.py capture

      - name: Upload exact pinned-next dry-run payload and receipt
        if: ${{ steps.release.outputs.pinned_next == 'true' && inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.pinned_artifact }}-${{ github.run_id }}
          path: |
            release-candidate/${{ steps.release.outputs.pinned_tgz }}
            release-candidate/package-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Write release receipt
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
          RELEASE_PATH: ${{ steps.release.outputs.path }}
          RELEASE_PLUGIN: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dryRun = process.env.DRY_RUN === 'true';
          const workspace = process.env.RELEASE_WORKSPACE;
          fs.writeFileSync('release-receipt.json', JSON.stringify({
            dryRun,
            workspace,
            path: process.env.RELEASE_PATH,
            sha: process.env.GITHUB_SHA,
            plugin: process.env.RELEASE_PLUGIN,
            version: process.env.RELEASE_VERSION,
            distTag: process.env.RELEASE_DIST_TAG,
          }) + '\n');
          if (dryRun) console.log(`dry run: ${workspace}`);
          NODE

      - name: Upload release receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-receipt-${{ steps.release.outputs.plugin }}
          path: release-receipt.json
          if-no-files-found: error

      - name: Publish context recognition through trusted publisher
        if: ${{ !inputs.dry_run && steps.release.outputs.plugin == 'bb-context-recognition' && steps.release.outputs.pinned_next != 'true' }}
        # This package must fail closed if its configured GitHub OIDC trust is missing.
        # Keep NPM_TOKEN available to other packages; never pass it to this step.
        shell: bash
        run: |
          test "$RELEASE_WORKSPACE" = '@phosphorco/bb-context-recognition'
          npm publish --ignore-scripts --access public --provenance --workspace "$RELEASE_WORKSPACE" --tag "$RELEASE_DIST_TAG"
        env:
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ''

      - name: Publish public package
        if: ${{ !inputs.dry_run && steps.release.outputs.plugin != 'bb-context-recognition' && steps.release.outputs.pinned_next != 'true' }}
        # The repository is public, so every release carries SLSA provenance.
        run: npm publish --ignore-scripts --access public --provenance --workspace "$RELEASE_WORKSPACE" --tag "$RELEASE_DIST_TAG"
        env:
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          # Only needed for a package's first release. Once npm trusted publishing
          # is configured, npm uses GitHub OIDC before falling back to this token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download and verify the exact reviewed pinned-next dry-run artifact
        if: ${{ steps.release.outputs.pinned_next == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLUGIN: ${{ steps.release.outputs.plugin }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: python3 .github/scripts/bb-identity-next-release.py download

      - name: Publish only the reviewed pinned-next tgz
        if: ${{ steps.release.outputs.pinned_next == 'true' && steps.release.outputs.pinned_route == 'oidc' && !inputs.dry_run }}
        env:
          # Pinned release uses only the current GitHub OIDC exchange.
          NODE_AUTH_TOKEN: ''
          RELEASE_PLUGIN: ${{ steps.release.outputs.plugin }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        shell: bash
        run: |
          python3 .github/scripts/bb-identity-next-release.py preflight
          publish_status=0
          python3 .github/scripts/bb-identity-next-release.py publish > publication-result.json 2> publication-error.log || publish_status=$?
          printf '{"exitCode":%s}\n' "$publish_status" > publication-status.json
          postflight_status=0
          python3 .github/scripts/bb-identity-next-release.py postflight || postflight_status=$?
          printf '{"exitCode":%s}\n' "$postflight_status" > postflight-status.json
          if [ "$publish_status" -ne 0 ]; then
            echo "Publish returned $publish_status; postflight ran once; inspect retained receipts before any retry" >&2
            exit "$publish_status"
          fi
          exit "$postflight_status"

      - name: Bootstrap membership from the reviewed tgz
        if: ${{ steps.release.outputs.pinned_next == 'true' && steps.release.outputs.pinned_route == 'membership-bootstrap' && steps.release.outputs.plugin == 'bb-thread-membership' && !inputs.dry_run }}
        env:
          # First package publish only; missing repository credential fails closed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PLUGIN: ${{ steps.release.outputs.plugin }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        shell: bash
        run: |
          python3 .github/scripts/bb-identity-next-release.py preflight
          publish_status=0
          python3 .github/scripts/bb-identity-next-release.py publish > publication-result.json 2> publication-error.log || publish_status=$?
          printf '{"exitCode":%s}\n' "$publish_status" > publication-status.json
          postflight_status=0
          python3 .github/scripts/bb-identity-next-release.py postflight || postflight_status=$?
          printf '{"exitCode":%s}\n' "$postflight_status" > postflight-status.json
          if [ "$publish_status" -ne 0 ]; then
            echo "Publish returned $publish_status; postflight ran once; inspect retained receipts before any retry" >&2
            exit "$publish_status"
          fi
          exit "$postflight_status"

      - name: Upload pinned-next publication selection and outcome
        if: ${{ always() && steps.release.outputs.pinned_next == 'true' && !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.pinned_publication }}-${{ github.run_id }}
          path: |
            artifact-selection.json
            publication-result.json
            publication-error.log
            publication-status.json
            postflight-status.json
            registry-before.json
            registry-after.json
            release-candidate/package-receipt.json
          if-no-files-found: warn
