name: Validate pull request

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Acquire the exact fork SDK release artifact
        # SDK archives are retained outside Git. Verify immutable selected bytes.
        shell: bash
        run: |
          mkdir -p ../sdk-artifacts
          archive='get-bb-plugin-sdk-0.6.52+phosphor.975e38f02f1a.sdk.12eb78c20820.tgz'
          base='https://github.com/phosphorco/bb-fork/releases/download/sdk-0.6.52-phosphor.975e38f02f1a'
          curl --fail --location --retry 3 "$base/$archive" --output "../sdk-artifacts/$archive"
          curl --fail --location --retry 3 "$base/$archive.provenance.json" --output "../sdk-artifacts/$archive.provenance.json"
          printf '%s  %s\n' 'f9bca05575191c8e9be5bf8d641755dbea95cd00853869e9e472b428c366d5ae' "../sdk-artifacts/$archive" | sha256sum --check
          printf '%s  %s\n' '4b531f886692b34d66fb97bda8178f8d666a9bd3692d853379f45992d8591bb7' "../sdk-artifacts/$archive.provenance.json" | sha256sum --check

      - name: Set up Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check release gates offline
        run: |
          python3 .github/scripts/test-pinned-release.py
          python3 .github/scripts/test-context-recognition-publish.py
          python3 .github/scripts/test-markdown-release.py
          node --test .github/scripts/check-turn-results-artifacts.test.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Build libraries for package tests
        run: |
          npm run build --workspace @phosphorco/bb-identity
          npm run build --workspace @phosphorco/bb-provider-settings
          npm run build --workspace @phosphorco/bb-context-recognition
          npm run build --workspace @phosphorco/bb-turn-results
          npm run build --workspace @phosphorco/bb-markdown
          npm run build --workspace @phosphorco/bb-cross-references
          npm run build --workspace @phosphorco/bb-agent-connection
          npm run build --workspace @phosphorco/bb-people-accounts
          npm run build --workspace @phosphorco/bb-thread-context

          npm run build --workspace @phosphorco/bb-thread-filters

      - name: Check out the selected Turn Results compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: phosphorco/bb-fork
          ref: 3976be61002511a61ca07f0969ff5838772ed5c0
          submodules: true
          path: .bb-toolchain/fork

      - name: Prepare the selected Turn Results compiler
        run: bash .github/scripts/prepare-turn-results-toolchain.sh

      - name: Install published Turn Results development inputs
        shell: bash
        run: |
          sdk="$GITHUB_WORKSPACE/../sdk-artifacts/get-bb-plugin-sdk-0.6.52+phosphor.975e38f02f1a.sdk.12eb78c20820.tgz"
          for plugin in turn-results turn-result-images; do
            npm install --prefix "plugins/$plugin" --workspaces=false --include=dev --ignore-scripts --package-lock=false --no-save --no-audit --no-fund --registry=https://registry.npmjs.org "$sdk"
          done
          npm rebuild --prefix plugins/turn-result-images/node_modules/better-sqlite3 --workspaces=false
          npm rebuild --prefix plugins/turn-result-images/node_modules/bun --workspaces=false

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build BB artifacts
        run: npm run build

      - name: Verify selected Turn Results artifacts
        run: |
          node .github/scripts/check-turn-results-artifacts.mjs plugins/turn-results
          node .github/scripts/check-turn-results-artifacts.mjs plugins/turn-result-images

      - name: Inspect Agentation Mentions package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-agentation-mentions

      - name: Inspect People Accounts package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-people-accounts

      - name: Inspect Cross References package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-cross-references

      - name: Inspect Machine Monitor package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-machine-monitor

      - name: Inspect Perspectives package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-perspectives

      - name: Inspect Sticky Notes package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-sticky-notes

      - name: Inspect BB UI Reference package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-bb-ui-reference

      - name: Inspect Message Timings Nerd package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-message-timings-nerd

      - name: Inspect BB Identity package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-identity

      - name: Inspect BB Provider Settings package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-provider-settings

      - name: Inspect BB Context Recognition package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-context-recognition

      - name: Inspect BB Turn Results package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-turn-results

      - name: Verify BB Turn Results archive and entry peers
        run: npm run verify:packed --workspace @phosphorco/bb-turn-results

      - name: Inspect BB Markdown package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-markdown

      - name: Verify BB Markdown packed consumer and public SDK peers
        run: npm run test:packed-consumer --workspace @phosphorco/bb-markdown

      - name: Inspect BB Agent Connection package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-agent-connection

      - name: Inspect Thread Filters package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-thread-filters

      - name: Inspect Thread Context package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-thread-context

      - name: Inspect Turn Results plugin package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-turn-results

      - name: Inspect Turn Result Images plugin package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-turn-result-images
