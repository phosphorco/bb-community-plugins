name: Validate pull request

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Acquire the exact fork SDK release artifact
        # SDK archives are retained outside Git. Verify immutable selected bytes.
        shell: bash
        run: |
          mkdir -p ../sdk-artifacts
          archive='get-bb-plugin-sdk-0.6.52+phosphor.975e38f02f1a.sdk.12eb78c20820.tgz'
          base='https://github.com/phosphorco/bb-workspace/releases/download/sdk-0.6.52-phosphor.975e38f02f1a'
          curl --fail --location --retry 3 "$base/$archive" --output "../sdk-artifacts/$archive"
          curl --fail --location --retry 3 "$base/$archive.provenance.json" --output "../sdk-artifacts/$archive.provenance.json"
          printf '%s  %s\n' 'f9bca05575191c8e9be5bf8d641755dbea95cd00853869e9e472b428c366d5ae' "../sdk-artifacts/$archive" | sha256sum --check
          printf '%s  %s\n' '4b531f886692b34d66fb97bda8178f8d666a9bd3692d853379f45992d8591bb7' "../sdk-artifacts/$archive.provenance.json" | sha256sum --check

      - name: Set up Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build libraries for package tests
        run: |
          npm run build --workspace @phosphorco/bb-identity
          npm run build --workspace @phosphorco/bb-provider-settings
          npm run build --workspace @phosphorco/bb-context-recognition
          npm run build --workspace @phosphorco/bb-cross-references
          npm run build --workspace @phosphorco/bb-agent-connection

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build BB artifacts
        run: npm run build

      - name: Inspect Agentation Mentions package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-agentation-mentions

      - name: Inspect Cross References package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-cross-references

      - name: Inspect Machine Monitor package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-machine-monitor

      - name: Inspect Perspectives package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-perspectives

      - name: Inspect Sticky Notes package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-sticky-notes

      - name: Inspect BB UI Reference package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-bb-ui-reference

      - name: Inspect Message Timings Nerd package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-plugin-message-timings-nerd

      - name: Inspect BB Identity package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-identity

      - name: Inspect BB Provider Settings package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-provider-settings

      - name: Inspect BB Context Recognition package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-context-recognition

      - name: Inspect BB Agent Connection package
        run: npm pack --dry-run --ignore-scripts --workspace @phosphorco/bb-agent-connection
